name: Feature request
description: An idea for the mod.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation in game, not the solution. "I keep walking back to the ore chest" tells more than "add a button".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you'd like it to work
      description: Optional. If you have a specific design in mind, describe it, including whether it should be a setting and what the default should be.
